[platformio]
default_envs = esp32doit-devkit-v1
src_dir = firmware/src
include_dir = firmware/src

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
; Auto-run asset conversion pipeline before every build
extra_scripts = pre:firmware/scripts/pre_build_assets.py
; Expose src/, system/, applets/clicker/, and generated_assets/ so headers are found cleanly
build_flags = 
    -I firmware/src
    -I firmware/src/system
    -I firmware/src/applets/clicker
    -I firmware/src/generated_assets

[env:esp32doit-devkit-v1-debug]
extends = env:esp32doit-devkit-v1
build_flags =
    -I firmware/src
    -I firmware/src/system
    -I firmware/src/applets/clicker
    -I firmware/src/generated_assets
    -DCLICKER_DEBUG=1
