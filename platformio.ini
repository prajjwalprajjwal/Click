[platformio]
default_envs = rp2354
src_dir = firmware/src
include_dir = firmware/src

[env:rp2354]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 48000000L
board_build.filesystem_size = 0.5m
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    vshymanskyy/Preferences@^2.1.0
    adafruit/Adafruit NeoPixel@^1.12.0
extra_scripts = pre:firmware/scripts/pre_build_assets.py
build_flags = 
    -I firmware/src
    -I firmware/src/system
    -I firmware/src/applets/clicker
    -I firmware/src/generated_assets
    -D TARGET_RP2354=1

[env:rp2354-debug]
extends = env:rp2354
build_flags =
    -I firmware/src
    -I firmware/src/system
    -I firmware/src/applets/clicker
    -I firmware/src/generated_assets
    -D TARGET_RP2354=1
    -D CLICKER_DEBUG=1
    -D CLICK_HW_TEST_MENU=1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
extra_scripts = pre:firmware/scripts/pre_build_assets.py
build_flags = 
    -I firmware/src
    -I firmware/src/system
    -I firmware/src/applets/clicker
    -I firmware/src/generated_assets

[env:esp32doit-devkit-v1-debug]
extends = env:esp32doit-devkit-v1
build_flags =
    -I firmware/src
    -I firmware/src/system
    -I firmware/src/applets/clicker
    -I firmware/src/generated_assets
    -D CLICKER_DEBUG=1
