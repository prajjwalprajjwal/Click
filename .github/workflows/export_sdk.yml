name: Sync Click SDK & AI Agent Context

on:
  push:
    branches:
      - main
    paths:
      - 'firmware/**'
      - 'tools/**'
      - 'platformio.ini'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Click Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SDK Exporter
        run: |
          python3 tools/sdk/export_sdk.py

      - name: Commit & Push Updated SDK (if changed)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sdk/
          if git diff --staged --quiet; then
            echo "No changes in SDK files. Everything is up to date."
          else
            git commit -m "chore(sdk): auto-update Click SDK specification and AI agent prompt [skip ci]"
            git push origin main
          fi

      - name: Push to External Web App Repo (Automated Cross-Repo Sync)
        if: ${{ secrets.SYNC_PAT != '' }}
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          TARGET_REPO: ${{ vars.TARGET_APP_REPO || 'prajjwalprajjwal/click-studio' }}
        run: |
          echo "Synchronizing SDK to external repository: $TARGET_REPO"
          rm -rf target_repo
          git clone "https://x-access-token:${SYNC_PAT}@github.com/${TARGET_REPO}.git" target_repo
          mkdir -p target_repo/sdk
          cp -r sdk/* target_repo/sdk/
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sdk/
          if git diff --staged --quiet; then
            echo "Target repository is already up to date."
          else
            git commit -m "chore(sdk): auto-sync Click OS SDK & AI prompt from $GITHUB_REPOSITORY@$GITHUB_SHA"
            git push origin main
            echo "Successfully pushed latest SDK to $TARGET_REPO!"
          fi
